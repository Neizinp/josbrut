<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f4ee">
    <meta name="description" content="Svenska rubriker från Omni, SVT, Sydsvenskan, Feber och SweClockers.">
    <title>Nyheter</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1">
    <link rel="stylesheet" href="./styles.css?v=load-more-100-view-1">
    <script src="./app.js?v=load-more-100-view-2" defer></script>
  </head>
  <body>
    <main class="layout">
      <aside class="rail" aria-label="Källor">
        <div class="rail-heading"><span>BEVAKNING</span><span class="live-dot" aria-hidden="true"></span></div>
        <nav class="source-nav" id="source-nav" aria-label="Filtrera efter källa">
          <label class="source-filter is-active" for="source-all">
            <input id="source-all" type="checkbox" checked>
            <span>Alla rubriker</span>
            <span class="source-count" id="all-count">0</span>
          </label>
        </nav>
        <div class="rail-foot"><span id="update-time">Väntar på nyheter</span></div>
      </aside>

      <section class="feed" aria-label="Nyhetsflöde">
        <div class="toolbar">
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></svg>
            <input id="search-input" type="search" placeholder="Sök bland rubriker" autocomplete="off" aria-label="Sök bland rubriker">
            <kbd>/</kbd>
          </label>
          <button class="refresh-button" id="refresh-button" type="button" title="Hämta senaste uppdateringen" aria-label="Hämta senaste uppdateringen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>
          </button>
          <div class="toolbar-status" id="results-status" aria-live="polite">Laddar flödet...</div>
        </div>

        <div id="feed-status" class="feed-status" role="status" hidden></div>
        <div class="article-list" id="article-list" aria-live="polite"></div>
        <div class="empty-state" id="empty-state" hidden>
          <h2>Inga rubriker här.</h2>
          <p>Prova en annan källa eller sökning.</p>
        </div>
        <div class="load-more-wrap" id="load-more-wrap" hidden>
          <button class="load-more-button" id="load-more-button" type="button">Ladda 100 till</button>
        </div>
        <footer class="feed-footer"><span>RSS / SENASTE 7 DYGN</span><span>ÖPPNA ARTIKELN HOS KÄLLAN ↗</span></footer>
      </section>
    </main>
  </body>
</html>
